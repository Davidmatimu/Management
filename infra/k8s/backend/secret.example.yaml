# TEMPLATE ONLY - do not `kubectl apply -f` this file. It exists to document
# the shape of the two Secrets the backend Deployment expects. Create the
# real ones from Terraform's Secrets Manager outputs - see
# docs/AWS-DEPLOYMENT.md step 6 for the exact `kubectl create secret`
# commands. Never commit real values here.

apiVersion: v1
kind: Secret
metadata:
  name: tms-app-db
  namespace: tms
type: Opaque
stringData:
  DB_HOST: "REPLACE_ME.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_USERNAME: "tms"
  DB_PASSWORD: "REPLACE_ME"
  DB_NAME: "tms"
---
apiVersion: v1
kind: Secret
metadata:
  name: tms-app-secrets
  namespace: tms
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_ME"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_ME"
  # Optional - omit to disable the AI-assist endpoints (draft objective, suggest SF-182 codes)
  ANTHROPIC_API_KEY: ""
  # Optional - omit EMAIL_* entirely if you don't want notification emails sent
  EMAIL_HOST: ""
  EMAIL_PORT: ""
  EMAIL_USER: ""
  EMAIL_PASS: ""
  EMAIL_FROM_ADDRESS: ""
  EMAIL_FROM_NAME: ""
